<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>МБОУ "Иртышская СОШ" - сайт обновляется</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<style>
:root{--bg:#f4f6ff;--card:#fff;--text:#1a1f36;--dim:#5f6785;--line:#e3e7f5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1020;--card:#161a30;--text:#e9ecff;--dim:#9aa3c7;--line:#262c4d}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.55 'Segoe UI',system-ui,sans-serif}
.c{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 26px;text-align:center;box-shadow:0 14px 40px rgba(20,30,80,.08)}
.e{font-size:52px;line-height:1;margin-bottom:14px;display:inline-block;animation:s 3s ease-in-out infinite}
@keyframes s{50%{transform:rotate(-12deg)}}
h1{font-size:22px;margin-bottom:6px}
p{color:var(--dim)}
small{display:block;margin-top:18px;color:var(--dim);font-size:13px}
@media (prefers-reduced-motion:reduce){.e{animation:none}}
</style>
</head>
<body>
<div class="c">
  <div class="e">🛠</div>
  <h1>МБОУ "Иртышская СОШ"</h1>
  <p>Сайт временно закрыт на обновление. Скоро здесь появится новая версия.</p>
  <small>с. Иртыш, Черлакский район, Омская область</small>
</div>
</body>
</html>
